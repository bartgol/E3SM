name: debug ubuntu runner

on:
  # Runs every time a PR is open against master
  pull_request:
    branches: ["master"]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: install dependencies
        run: |
          sudo apt-get install -y \
            libblas-dev           \
            liblapack-dev         \
            libopenmpi-dev        \
            openmpi-bin           \
            libhdf5-openmpi-dev   \
            libnetcdf-mpi-dev     \
            libnetcdf-pnetcdf-dev \
            libnetcdff-dev        \
            libpnetcdf-dev
      - name: use nc-config
        run: nc-config --all
      - name: use nf-config
        run: nf-config --all
      - name: list pnetcdf content
        run: dpkg -L libpnetcdf-dev
      - name: use pnetcdf-config
        run: pnetcdf-config --all
